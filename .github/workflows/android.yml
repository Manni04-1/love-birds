name: Android app

# Builds an installable Android app (APK) on GitHub's servers.
# - Every pull request: builds the app to check it still compiles.
# - Every push to main: builds it and publishes it as the "Love Birds for Android"
#   release, so phones can download it from one fixed link. It also sends the
#   new code to phones that already have the app (an over-the-air update), so
#   most changes arrive without reinstalling.
#
# Over-the-air updates use Expo (EAS Update) and need the repository secret
# EXPO_TOKEN, an access token from expo.dev > Account settings > Access tokens.
# Without it, the app still builds, just without automatic updates.
#
# Builds from main are signed with the app's own private key, which lives on
# expo.dev as the sensitive environment variable ANDROID_SIGNING_KEY (see
# .github/scripts/signing-key.sh). Only an app signed with the same key can
# update the one on your phones. Pull request builds keep Android's public debug
# key, so they can't install over the real app.
#
# The app connects to the Supabase project below. The publishable key is meant
# to ship inside the app (Supabase's privacy rules protect the data), so it is
# fine to keep here. To point the app at another project, set the repository
# variables SUPABASE_URL and SUPABASE_ANON_KEY under
# Settings > Secrets and variables > Actions > Variables.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with the app's private key (builds from main always are)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://brijfdeciwhlankmoeet.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_NTHyyalfG8dmPtYJ93Uz9Q_zjl7CRLt' }}
      EXPO_NO_TELEMETRY: 1
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Check the code
        run: |
          npm run typecheck
          npm run lint

      # Links the app to its Expo project (creating it the first time) and points
      # the app at that project's update server.
      - name: Connect to Expo for automatic updates
        if: env.EXPO_TOKEN != ''
        run: |
          npx --yes eas-cli@27 init --non-interactive --force
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const id = app.expo.extra?.eas?.projectId;
            if (!id) throw new Error("No Expo project ID in app.json");
            app.expo.updates = { ...app.expo.updates, url: `https://u.expo.dev/${id}` };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log(`Expo project ID: ${id}`);
          '

      - name: Generate the Android project
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      # Makes the key the first time, so it needs EXPO_TOKEN. Without it, this
      # stops the build rather than publish an app your phones can't install.
      - name: Use the app's signing key
        if: github.ref == 'refs/heads/main' || inputs.sign
        run: .github/scripts/signing-key.sh

      - name: Build the app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk love-birds.apk

      - name: Check the signature
        if: github.ref == 'refs/heads/main' || inputs.sign
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          signed=$("$apksigner" verify --print-certs love-birds.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          ours=$(keytool -list -v -keystore "$LOVE_BIRDS_KEYSTORE" -storepass "$LOVE_BIRDS_KEYSTORE_PASSWORD" -alias lovebirds \
            | grep -m1 'SHA256:' | awk '{print $NF}' | tr -d : | tr 'A-F' 'a-f')
          if [ -z "$signed" ] || [ "$signed" != "$ours" ]; then
            echo "::error::The app isn't signed with the Love Birds key."
            exit 1
          fi
          echo "Signed with the Love Birds key, certificate SHA-256 $signed"

      - uses: actions/upload-artifact@v4
        with:
          name: love-birds-android
          path: love-birds.apk
          retention-days: 14

      - name: Publish the download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest love-birds.apk \
            --title "Love Birds for Android" \
            --target "${GITHUB_SHA}" \
            --latest \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%d %b %Y'). Open this page on your Android phone, tap love-birds.apk, and allow your browser to install apps when asked."

      # Phones running a build with the same app version pick this up the next
      # time the app opens. Bump "version" in app.json whenever a native package
      # is added or upgraded, so old installs don't get code they can't run.
      - name: Send the update to installed apps
        if: github.ref == 'refs/heads/main' && env.EXPO_TOKEN != ''
        run: |
          npx --yes eas-cli@27 update --channel production --platform android \
            --environment production --non-interactive \
            --message "$(git log -1 --format=%s)"
