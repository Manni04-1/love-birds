<!--
  Love Birds: the "Reset password" email. In Supabase, open Authentication > Emails > Templates >
  Reset password, set the subject to "Your Love Birds code", and paste everything below as the body.
  The app asks for the code ({{ .Token }}), so the email has no link to open.
-->
<h2>Set a new Love Birds password</h2>
<p>Here is your code:</p>
<p style="font-size: 32px; font-weight: bold; letter-spacing: 6px; margin: 16px 0;">{{ .Token }}</p>
<p>Type it into Love Birds with your new password. It works for one hour.</p>
<p>If you didn't ask for this, ignore this email and your password stays the same.</p>
